<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020304">
<title>Positions · Live</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
</head><body>
<div class="aura" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
<div class="wrap">
  <header class="top rise" style="--d:0">
    <div class="brand">PNL<small>positions</small></div>
    <div class="nav"><a href="./">Panel</a><a href="positions.html" class="on">Positions</a><a href="strategies.html">Strategies</a></div>
    <div class="live" id="live"><i></i><span id="ago">Live</span></div>
  </header>
  <nav class="tabs rise" style="--d:1" id="tabs"></nav>
  <div class="ctl rise" style="--d:2">
    <select id="fSort" data-k="sort"><option value="new">Newest</option><option value="old">Oldest</option><option value="hi">PnL high → low</option><option value="lo">PnL low → high</option></select>
    <select id="fAsset" data-k="asset"></select><select id="fStrat" data-k="strat"></select>
    <select id="fStatus" data-k="status"><option value="">Open &amp; closed</option><option value="open">Open</option><option value="closed">Closed</option></select>
    <select id="fMode" data-k="mode"><option value="">Live &amp; shadow</option><option value="live">Live</option><option value="shadow">Shadow</option></select>
  </div>
  <div class="sum" id="sum"></div>
  <section class="card tbl rise" style="--d:2">
    <table><thead><tr><th>Date</th><th>Strategy</th><th>Asset</th><th class="r">RR / Lots</th><th class="r">PnL</th></tr></thead>
    <tbody id="rows"><tr class="none"><td colspan="5">No positions yet</td></tr></tbody></table>
  </section>
</div>
<script src="positions.js?v=11"></script>
</body></html>
