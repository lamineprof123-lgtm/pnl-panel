<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020304">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Cpath d=%22M1 15 6 8l3 3 6-9%22 stroke=%22%235eead4%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E">
<title>PnL · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="style.css?v=6">
</head><body>
<div class="aura" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
<div class="wrap">
  <header class="top rise" style="--d:0">
    <div class="brand">PNL<small>panel</small></div>
    <div class="live" id="live"><i></i><span id="ago">Live</span></div>
  </header>

  <section class="hero rise" style="--d:1">
    <label>Total P&amp;L</label>
    <div class="big odo" id="heroPnl"></div>
    <div class="sub"><span class="pill" id="heroRoi">0.00%</span><span class="per"><span id="perLbl">Today</span> <b id="perPnl">$0.00</b></span></div>
  </section>

  <nav class="seg rise" style="--d:2" id="seg" role="tablist">
    <i class="slider"></i>
    <button data-p="daily" class="on">Daily</button><button data-p="monthly">Monthly</button><button data-p="yearly">Yearly</button>
  </nav>

  <main id="cards"></main>
</div>
<script src="app.js?v=6"></script>
</body></html>
