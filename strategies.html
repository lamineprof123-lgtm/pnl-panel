<!doctype html><html lang="en"><head><meta charset="utf-8">

<title>Strategies · Live</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

</head><body>
<div class="aura" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></div>
<div class="wrap">
  <header class="top rise" style="--d:0">
    <div class="brand">PNL<small>strategies</small></div>
    <div class="nav"><a href="visualization.html">Visualization</a><a href="./">Panel</a><a href="positions.html">Positions</a><a href="strategies.html" class="on">Strategies</a></div>

  </header>
  <nav class="tabs rise" style="--d:1" id="tabs"></nav>
  <div class="ctl rise" style="--d:2">
    <select id="fSort" data-k="sort"><option value="hi">PnL high → low</option><option value="lo">PnL low → high</option><option value="days">Most active days</option><option value="n">Most trades</option><option value="win">Best win rate</option></select>
    <select id="fAsset" data-k="asset"></select>
    <select id="fStatus" data-k="status"><option value="">Open &amp; closed</option><option value="closed">Closed only</option></select>
    <select id="fMode" data-k="mode"><option value="">Live &amp; shadow</option><option value="live">Live</option><option value="shadow">Shadow</option></select>
  </div>
  <div class="sum" id="sum"></div>
  <section class="card tbl rise" style="--d:2">
    <table><thead><tr><th>Strategy</th><th>Active days</th><th>Asset</th><th class="r">Trades · Win</th><th class="r">Overall PnL</th></tr></thead>
    <tbody id="rows"><tr class="none"><td colspan="5">No strategies yet</td></tr></tbody></table>
  </section>
</div>
